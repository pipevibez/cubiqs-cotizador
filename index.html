<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cotizador interactivo de servicios digitales Cubiqs." />
  <title>Cubiqs | Cotizador de servicios</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Cubiqs, volver al inicio">
      <span class="brand-mark">
        <img src="assets/cubiqs-logo-positivo.png" alt="" />
      </span>
      <span class="brand-name">Cubiqs</span>
    </a>
  </header>

  <main class="app-shell">
    <section class="hero" aria-labelledby="catalog-title">
      <h1 id="catalog-title">Armá tu cotización</h1>
      <p>Elegí un rubro y explorá los servicios que mejor se adapten a tu proyecto.</p>
    </section>

    <section class="catalog-section" aria-label="Rubros de servicios">
      <div id="loading-state" class="status-card" aria-live="polite">
        <span class="loading-dot" aria-hidden="true"></span>
        <span>Preparando servicios...</span>
      </div>

      <div id="error-state" class="status-card error-card" hidden>
        <div>
          <h2>No pudimos cargar los servicios</h2>
          <p>Revisá la conexión e intentá nuevamente.</p>
        </div>
        <button id="btn-retry" type="button">Reintentar</button>
      </div>

      <div id="category-section" class="category-section" hidden>
        <div id="category-grid" class="category-carousel" role="list" aria-label="Rubros disponibles"></div>
        <div class="category-rail-shell">
          <input
            id="category-rail"
            class="category-rail"
            type="range"
            min="0"
            max="4"
            step="0.01"
            value="0"
            aria-label="Mover carrusel de rubros"
          />
        </div>
      </div>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay" hidden></div>

  <section
    id="service-modal"
    class="service-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="service-modal-title"
    aria-hidden="true"
    hidden
  >
    <header class="service-modal-header">
      <div>
        <h2 id="service-modal-title">Servicios</h2>
        <p id="service-modal-description"></p>
      </div>
      <button id="btn-close-service-modal" class="modal-close" type="button" aria-label="Cerrar servicios">×</button>
    </header>

    <div id="service-modal-list" class="service-list"></div>
  </section>
</body>
</html>
